<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f3efe4" />
    <meta name="description" content="音階で進むシャトルラン。レベルに合わせて効果音を高音質に変換して再生するWebアプリ。" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>無限シャトルラン</title>
    <style>
      @font-face {
        font-family: 'keifont';
        src: url('./fonts/keifont.ttf') format('truetype');
        font-display: swap;
      }
    </style>
  </head>
  <body>
    <main class="sheet">
      <header class="head">
        <h1 class="title">無限シャトルラン</h1>
        <p class="subtitle">INFINITY SHUTLRUN</p>
      </header>

      <!-- 設定画面 -->
      <section id="homePanel">
        <div class="panel">
          <p class="panel-label">設定</p>

          <div class="row">
            <label for="toneSelect">音色</label>
            <select id="toneSelect"></select>
          </div>

          <div class="row">
            <label for="initialSpeed">初期速度</label>
            <div class="slider-box">
              <input id="initialSpeed" type="range" min="0" max="50" step="0.1" value="8" />
              <span class="value"><span id="initialSpeedVal">8.0</span> km/h</span>
            </div>
          </div>

          <div class="row">
            <label for="speedRate">速度変化</label>
            <div class="slider-box">
              <input id="speedRate" type="range" min="0" max="10" step="0.05" value="0.5" />
              <span class="value"><span id="speedRateVal">0.50</span> km/h</span>
            </div>
          </div>

          <div class="row">
            <label for="levelInterval">レベルアップ時間</label>
            <div class="slider-box">
              <input id="levelInterval" type="range" min="0" max="600" step="1" value="60" />
              <span class="value"><span id="levelIntervalVal">60</span> 秒</span>
            </div>
          </div>
        </div>

        <button id="startBtn" class="start-btn" type="button">スタート</button>
        <p class="note">レベルが上がると効果音は速くなります。変換には ffmpeg（atempo）を使っています。</p>
      </section>

      <!-- 実行画面 -->
      <section id="runPanel" hidden>
        <div id="countOverlay" class="count-overlay" hidden>
          <span id="countNum">5</span>
        </div>
        <div class="grid">
          <div class="cell">
            <p class="cell-label">レベル</p>
            <p class="cell-value" id="levelVal">1</p>
          </div>
          <div class="cell">
            <p class="cell-label">走行速度 km/h</p>
            <p class="cell-value" id="speedVal">8.0</p>
          </div>
          <div class="cell">
            <p class="cell-label">シャトル</p>
            <p class="cell-value" id="shuttleVal">0</p>
          </div>
          <div class="cell">
            <p class="cell-label">総走行時間</p>
            <p class="cell-value time" id="timeVal">00:00:00</p>
          </div>
        </div>
        <button id="stopBtn" class="stop-btn" type="button">ストップ</button>
      </section>

      <footer class="foot">
        <p id="engineStatus">変換エンジン: 準備中</p>
      </footer>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
